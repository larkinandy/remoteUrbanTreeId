<!doctype html><html lang="en"><meta charset="utf-8">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.55 Arial,sans-serif;color:#243c35;background:white}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.chart{min-width:0}
aside{margin-top:12px;padding:24px;border:1px solid #dce6e0;border-radius:16px;background:#f6f9f6;align-self:start}
h2{font-size:25px;line-height:1.2;margin:12px 0;font-style:italic}h3{margin:24px 0 8px;font-size:17px}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#668177}.badge{display:inline-block;border-radius:20px;padding:4px 12px;background:#e2eee6;font-size:12px}
dl{margin:14px 0}dt{color:#6a7e74;font-size:12px}dd{margin:0 0 10px;font-weight:600}
button{background:white;border:1px solid #b6cbbf;border-radius:7px;padding:8px 12px;color:#243c35;cursor:pointer}
.hint{font-size:12px;color:#698074}#members{max-height:150px;overflow:auto;padding-left:18px;font-size:13px}
@media(max-width:750px){.layout{grid-template-columns:1fr}aside{margin:0 10px 20px}.chart{height:720px}}
</style><div class="layout"><div class="chart"><!--CHART--></div><aside aria-label="Taxon details">
<div class="eyebrow">Taxon inspector</div><div id="detail"></div>
<button id="unpin" type="button">Resume hover</button><p id="status" class="hint">Hover to inspect · click to pin</p>
</aside></div></html>
